<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para Angelina 💗</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            font-family: Georgia, "Times New Roman", serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle at center,
                    #fff8fc 0%,
                    #ffd9e9 45%,
                    #ffb6d5 100%
                );
        }

        /* ==========================================
           FONDO
        ========================================== */

        #corazones {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        /* ==========================================
           CORAZONES DEL FONDO
        ========================================== */

        .corazon-fondo {
            position: absolute;

            width: 24px;
            height: 24px;

            background: #ff69b4;

            transform: rotate(-45deg);

            border-radius: 4px;

            opacity: 0.7;

            animation:
                subir linear forwards,
                balancear ease-in-out infinite alternate;
        }

        .corazon-fondo::before,
        .corazon-fondo::after {
            content: "";

            position: absolute;

            width: 24px;
            height: 24px;

            background: inherit;

            border-radius: 50%;
        }

        .corazon-fondo::before {
            top: -12px;
            left: 0;
        }

        .corazon-fondo::after {
            top: 0;
            left: 12px;
        }

        @keyframes subir {
            from {
                bottom: -80px;
                transform: rotate(-45deg);
            }

            to {
                bottom: 110vh;
                transform: rotate(-45deg);
            }
        }

        @keyframes balancear {
            from {
                margin-left: -25px;
            }

            to {
                margin-left: 25px;
            }
        }

        /* ==========================================
           CONTENEDOR PRINCIPAL
        ========================================== */

        .contenedor {
            position: relative;

            z-index: 2;

            width: min(92vw, 720px);

            text-align: center;
        }

        /* ==========================================
           TITULO
        ========================================== */

        .titulo {
            margin-bottom: 8px;

            color: #d52d79;

            font-size: clamp(
                2.3rem,
                8vw,
                4rem
            );

            font-style: italic;

            text-shadow:
                0 0 5px white,
                0 0 15px #ff8fc1,
                0 0 30px #ff69b4;
        }

        .subtitulo {
            margin-bottom: 25px;

            color: #a93668;

            font-size: clamp(
                0.9rem,
                3vw,
                1.2rem
            );

            font-style: italic;
        }

        /* ==========================================
           CARTA
        ========================================== */

        .carta {
            position: relative;

            width: 100%;
            min-height: 420px;

            padding: 45px 35px;

            background:
                linear-gradient(
                    135deg,
                    #fffaff,
                    #fff0f7
                );

            border-radius: 12px;

            border: 5px solid #ff69b4;

            box-shadow:
                0 0 8px #ff69b4,
                0 0 20px #ff69b4,
                0 0 45px #ff9ccc,
                0 20px 50px rgba(
                    120,
                    40,
                    80,
                    0.25
                );

            overflow: hidden;

            cursor: pointer;

            transition:
                transform 0.5s ease,
                box-shadow 0.5s ease;

            animation: led 4s infinite linear;
        }

        @keyframes led {

            0% {
                border-color: #ff4f9a;

                box-shadow:
                    0 0 8px #ff4f9a,
                    0 0 20px #ff4f9a,
                    0 0 40px #ff9ccc;
            }

            25% {
                border-color: #ff8ac4;

                box-shadow:
                    0 0 8px #ff8ac4,
                    0 0 20px #ff8ac4,
                    0 0 40px #ffc1df;
            }

            50% {
                border-color: #d96cff;

                box-shadow:
                    0 0 8px #d96cff,
                    0 0 20px #d96cff,
                    0 0 40px #edbaff;
            }

            75% {
                border-color: #ff72b6;

                box-shadow:
                    0 0 8px #ff72b6,
                    0 0 20px #ff72b6,
                    0 0 40px #ffb6d9;
            }

            100% {
                border-color: #ff4f9a;

                box-shadow:
                    0 0 8px #ff4f9a,
                    0 0 20px #ff4f9a,
                    0 0 40px #ff9ccc;
            }
        }

        .carta:hover {
            transform: scale(1.015);
        }

        /* ==========================================
           BORDE INTERIOR
        ========================================== */

        .borde-interior {
            position: absolute;

            inset: 12px;

            border: 2px solid #ffc1dc;

            pointer-events: none;

            z-index: 10;
        }

        /* ==========================================
           SOBRE
        ========================================== */

        .sobre {
            position: absolute;

            inset: 0;

            z-index: 4;

            background:
                linear-gradient(
                    135deg,
                    #ffe0ed,
                    #fff4f9
                );

            transition:
                transform 1s ease,
                opacity 0.8s ease;

            clip-path: polygon(
                0 0,
                100% 0,
                50% 58%
            );
        }

        /* ==========================================
           CORAZON CENTRAL
        ========================================== */

        .corazon-boton {
            position: absolute;

            left: 50%;
            top: 53%;

            width: 75px;
            height: 75px;

            z-index: 7;

            background: #ff4f9a;

            border-radius: 8px;

            transform:
                translate(-50%, -50%)
                rotate(-45deg);

            box-shadow:
                0 0 10px #ff4f9a,
                0 0 25px #ff69b4,
                0 0 45px #ffb6d9;

            animation: latido 1.2s infinite;

            transition:
                opacity 0.5s ease;
        }

        .corazon-boton::before,
        .corazon-boton::after {
            content: "";

            position: absolute;

            width: 75px;
            height: 75px;

            background: #ff4f9a;

            border-radius: 50%;
        }

        .corazon-boton::before {
            top: -37px;
            left: 0;
        }

        .corazon-boton::after {
            top: 0;
            left: 37px;
        }

        @keyframes latido {

            0%,
            100% {
                scale: 1;
            }

            50% {
                scale: 1.12;
            }
        }

        /* ==========================================
           TEXTO DEL BOTON
        ========================================== */

        .texto-boton {
            position: absolute;

            left: 50%;
            top: 53%;

            transform:
                translate(-50%, -50%);

            width: 190px;

            z-index: 8;

            color: white;

            font-size: 0.9rem;

            font-weight: bold;

            text-shadow:
                0 2px 4px #a51c5c;

            pointer-events: none;

            transition:
                opacity 0.4s ease;
        }

        /* ==========================================
           CONTENIDO DE LA CARTA
        ========================================== */

        .contenido {
            position: relative;

            z-index: 3;

            min-height: 320px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            opacity: 0;

            transform:
                translateY(30px);

            transition:
                opacity 0.8s ease 0.6s,
                transform 0.8s ease 0.6s;

            pointer-events: none;
        }

        .contenido h2 {
            margin-bottom: 28px;

            color: #d52d79;

            font-size: clamp(
                1.5rem,
                5vw,
                2.3rem
            );

            font-style: italic;
        }

        .mensaje {
            max-width: 580px;

            color: #843454;

            font-size: clamp(
                1rem,
                3vw,
                1.3rem
            );

            line-height: 1.8;

            font-style: italic;
        }

        .firma {
            margin-top: 25px;

            color: #d52d79;

            font-size: 1.15rem;

            font-style: italic;
        }

        /* ==========================================
           CORAZONES DECORATIVOS
        ========================================== */

        .mini-corazon {
            position: absolute;

            z-index: 11;

            color: #ff69b4;

            font-size: 25px;

            animation: brillo 1.5s infinite alternate;

            pointer-events: none;
        }

        .mini1 {
            top: 25px;
            left: 30px;
        }

        .mini2 {
            top: 25px;
            right: 30px;
        }

        .mini3 {
            bottom: 25px;
            left: 30px;
        }

        .mini4 {
            bottom: 25px;
            right: 30px;
        }

        @keyframes brillo {

            from {
                opacity: 0.4;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1.15);
            }
        }

        /* ==========================================
           CARTA ABIERTA
        ========================================== */

        .carta.abierta {
            cursor: default;

            transform: scale(1);
        }

        .carta.abierta .sobre {
            transform: translateY(-110%);

            opacity: 0;
        }

        .carta.abierta .corazon-boton {
            opacity: 0;

            pointer-events: none;
        }

        .carta.abierta .texto-boton {
            opacity: 0;
        }

        .carta.abierta .contenido {
            opacity: 1;

            transform: translateY(0);

            pointer-events: auto;
        }

        /* ==========================================
           CELULAR
        ========================================== */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .contenedor {
                width: 94vw;
            }

            .titulo {
                margin-bottom: 5px;
            }

            .subtitulo {
                margin-bottom: 15px;
            }

            .carta {
                min-height: 430px;

                padding:
                    35px 18px;
            }

            .contenido {
                min-height: 350px;
            }

            .mensaje {
                line-height: 1.65;
            }

            .corazon-boton {
                width: 65px;
                height: 65px;
            }

            .corazon-boton::before,
            .corazon-boton::after {
                width: 65px;
                height: 65px;
            }

            .corazon-boton::before {
                top: -32px;
            }

            .corazon-boton::after {
                left: 32px;
            }

            .texto-boton {
                width: 155px;
                font-size: 0.78rem;
            }

            .mini-corazon {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- ==========================================
         CORAZONES DEL FONDO
    =========================================== -->

    <div id="corazones"></div>


    <!-- ==========================================
         CONTENIDO PRINCIPAL
    =========================================== -->

    <main class="contenedor">

        <h1 class="titulo">
            Angelina
        </h1>

        <p class="subtitulo">
            💗 Una pequeña carta para ti 💗
        </p>


        <!-- ======================================
             CARTA
        ======================================= -->

        <section
            class="carta"
            id="carta"
            onclick="abrirCarta()"
        >

            <!-- Borde interior -->
            <div class="borde-interior"></div>


            <!-- Sobre cerrado -->
            <div class="sobre"></div>


            <!-- Decoraciones -->
            <span class="mini-corazon mini1">♥</span>
            <span class="mini-corazon mini2">♥</span>
            <span class="mini-corazon mini3">♥</span>
            <span class="mini-corazon mini4">♥</span>


            <!-- Corazón para abrir -->
            <div
                class="corazon-boton"
                aria-label="Abrir carta"
            ></div>


            <!-- Texto del botón -->
            <div class="texto-boton">
                MACHUCA PARA ABRIR
            </div>


            <!-- ==================================
                 MENSAJE
            =================================== -->

            <div class="contenido">

                <h2>
                    Para Angelina 💗
                </h2>

                <p class="mensaje">
                    Mi mente es para pensarte,<br>
                    mi corazón para amarte.<br><br>

                    Si yo pudiera, te daría el mundo entero,<br>
                    pero lo único que te puedo dar<br>
                    es mi amor sincero.
                </p>

                <p class="firma">
                    Con cariño 💕
                </p>

            </div>

        </section>

    </main>


    <script>

        /* ==========================================
           CORAZONES DEL FONDO
        =========================================== */

        const contenedor =
            document.getElementById("corazones");

        const colores = [
            "#ff4f9a",
            "#ff69b4",
            "#ff85bd",
            "#ff9dcc",
            "#ffb6d9"
        ];


        function crearCorazon() {

            const corazon =
                document.createElement("div");

            corazon.className =
                "corazon-fondo";


            /* Tamaño aleatorio */

            const tamano =
                Math.random() * 25 + 15;

            corazon.style.width =
                tamano + "px";

            corazon.style.height =
                tamano + "px";


            /* Posición horizontal */

            corazon.style.left =
                Math.random() * 100 + "%";


            /* Velocidad */

            const duracion =
                Math.random() * 8 + 8;


            corazon.style.animationDuration =
                duracion + "s, " +
                (Math.random() * 2 + 1) + "s";


            /* Color */

            const color =
                colores[
                    Math.floor(
                        Math.random() *
                        colores.length
                    )
                ];

            corazon.style.background =
                color;


            /* Transparencia */

            corazon.style.opacity =
                Math.random() * 0.5 + 0.3;


            /* Agregar */

            contenedor.appendChild(
                corazon
            );


            /* Eliminar cuando termine */

            setTimeout(
                () => {
                    corazon.remove();
                },
                duracion * 1000
            );
        }


        /* Crear corazones iniciales */

        for (
            let i = 0;
            i < 35;
            i++
        ) {
            crearCorazon();
        }


        /* Crear continuamente */

        setInterval(
            crearCorazon,
            500
        );


        /* ==========================================
           ABRIR CARTA
        =========================================== */

        function abrirCarta() {

            const carta =
                document.getElementById(
                    "carta"
                );


            /* Evitar abrir otra vez */

            if (
                carta.classList.contains(
                    "abierta"
                )
            ) {
                return;
            }


            /* Abrir */

            carta.classList.add(
                "abierta"
            );
        }

    </script>

</body>
</html>
