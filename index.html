<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <!-- Adaptación para celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para Angelina 💗</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: Georgia, "Times New Roman", serif;

            background:
                radial-gradient(circle at center,
                #fff0f7 0%,
                #ffd6e8 45%,
                #ffb6d5 100%);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* =========================================
           FONDO DE CORAZONES
        ========================================= */

        #corazones {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .corazon-fondo {
            position: absolute;
            width: 30px;
            height: 30px;

            transform: rotate(-45deg);

            animation:
                flotar linear infinite,
                balancear ease-in-out infinite alternate;
        }

        .corazon-fondo::before,
        .corazon-fondo::after {
            content: "";
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: inherit;
        }

        .corazon-fondo::before {
            top: -15px;
            left: 0;
        }

        .corazon-fondo::after {
            top: 0;
            left: 15px;
        }

        @keyframes flotar {
            from {
                transform:
                    translateY(110vh)
                    rotate(-45deg);
            }

            to {
                transform:
                    translateY(-120px)
                    rotate(-45deg);
            }
        }

        @keyframes balancear {
            from {
                margin-left: -25px;
            }

            to {
                margin-left: 25px;
            }
        }

        /* =========================================
           CONTENEDOR
        ========================================= */

        .contenedor {
            position: relative;
            z-index: 2;

            width: min(90vw, 700px);

            text-align: center;
        }

        /* =========================================
           TITULO
        ========================================= */

        .titulo {
            margin-bottom: 25px;

            font-size: clamp(2.2rem, 7vw, 4rem);

            color: #d52d79;

            font-style: italic;

            text-shadow:
                0 0 5px #fff,
                0 0 15px #ff8fc1,
                0 0 25px #ff69b4;
        }

        .subtitulo {
            margin-top: -15px;
            margin-bottom: 25px;

            color: #a93465;

            font-size: clamp(0.9rem, 3vw, 1.2rem);

            font-style: italic;
        }

        /* =========================================
           CARTA
        ========================================= */

        .carta {
            position: relative;

            width: 100%;
            min-height: 400px;

            padding: 45px 35px;

            background:
                linear-gradient(
                    135deg,
                    #fffaff,
                    #fff0f7
                );

            border-radius: 8px;

            border: 5px solid #ff69b4;

            box-shadow:
                0 0 10px #ff69b4,
                0 0 25px #ff8fc1,
                0 20px 50px rgba(150, 40, 90, 0.25);

            transition:
                transform 0.8s ease,
                opacity 0.8s ease,
                box-shadow 0.4s ease;

            overflow: hidden;
        }

        /* Borde interior */

        .carta::before {
            content: "";

            position: absolute;
            inset: 12px;

            border: 2px solid #ffc1dc;

            pointer-events: none;
        }

        /* =========================================
           CARTA CERRADA
        ========================================= */

        .carta.cerrada {
            cursor: pointer;
        }

        .carta.cerrada:hover {
            transform: scale(1.02);
        }

        .sobre {
            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    135deg,
                    #ffe3ef,
                    #fff5fa
                );

            clip-path: polygon(
                0 0,
                100% 0,
                50% 55%
            );

            transition: transform 1s ease;

            z-index: 3;
        }

        .corazon-boton {
            position: absolute;

            left: 50%;
            top: 52%;

            transform: translate(-50%, -50%);

            width: 95px;
            height: 95px;

            background: #ff4f9a;

            transform-origin: center;

            rotate: -45deg;

            border-radius: 10px;

            box-shadow:
                0 0 10px #ff69b4,
                0 0 25px #ff69b4,
                0 0 45px #ffb6d9;

            z-index: 5;

            cursor: pointer;

            animation: latido 1.2s infinite;
        }

        .corazon-boton::before,
        .corazon-boton::after {
            content: "";

            position: absolute;

            width: 95px;
            height: 95px;

            background: #ff4f9a;

            border-radius: 50%;
        }

        .corazon-boton::before {
            top: -47px;
            left: 0;
        }

        .corazon-boton::after {
            left: 47px;
            top: 0;
        }

        @keyframes latido {
            0%, 100% {
                scale: 1;
            }

            50% {
                scale: 1.1;
            }
        }

        .texto-boton {
            position: absolute;

            left: 50%;
            top: 52%;

            transform: translate(-50%, -50%);

            z-index: 6;

            width: 170px;

            color: white;

            font-weight: bold;

            font-size: 0.95rem;

            text-shadow:
                0 1px 3px #a51c5c;

            pointer-events: none;
        }

        /* =========================================
           CONTENIDO DE LA CARTA
        ========================================= */

        .contenido {
            position: relative;

            z-index: 2;

            opacity: 0;

            transform: translateY(20px);

            transition:
                opacity 1s ease 0.7s,
                transform 1s ease 0.7s;

            pointer-events: none;
        }

        .contenido h2 {
            margin-bottom: 30px;

            color: #d52d79;

            font-size: clamp(
                1.5rem,
                5vw,
                2.2rem
            );

            font-style: italic;
        }

        .mensaje {
            color: #843454;

            font-size: clamp(
                1.05rem,
                3vw,
                1.35rem
            );

            line-height: 1.9;

            font-style: italic;
        }

        .firma {
            margin-top: 30px;

            color: #d52d79;

            font-size: 1.15rem;

            font-style: italic;
        }

        /* =========================================
           ESTADO ABIERTO
        ========================================= */

        .carta.abierta {
            cursor: default;

            transform: scale(1);

            animation: aparecerCarta 1s ease;
        }

        @keyframes aparecerCarta {
            0% {
                transform: scale(0.85);
            }

            60% {
                transform: scale(1.04);
            }

            100% {
                transform: scale(1);
            }
        }

        .carta.abierta .sobre {
            transform: translateY(-110%);
        }

        .carta.abierta .corazon-boton {
            opacity: 0;

            pointer-events: none;

            transition: opacity 0.5s ease;
        }

        .carta.abierta .texto-boton {
            opacity: 0;

            transition: opacity 0.3s ease;
        }

        .carta.abierta .contenido {
            opacity: 1;

            transform: translateY(0);

            pointer-events: auto;
        }

        /* =========================================
           CORAZONES DECORATIVOS
        ========================================= */

        .mini-corazon {
            position: absolute;

            font-size: 24px;

            color: #ff69b4;

            animation: brillo 1.5s infinite alternate;
        }

        .mini1 {
            top: 25px;
            left: 30px;
        }

        .mini2 {
            top: 25px;
            right: 30px;
        }

        .mini3 {
            bottom: 25px;
            left: 30px;
        }

        .mini4 {
            bottom: 25px;
            right: 30px;
        }

        @keyframes brillo {
            from {
                opacity: 0.4;

                transform: scale(0.8);
            }

            to {
                opacity: 1;

                transform: scale(1.2);
            }
        }

        /* =========================================
           CELULAR
        ========================================= */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .titulo {
                margin-bottom: 15px;
            }

            .subtitulo {
                margin-bottom: 15px;
            }

            .carta {
                min-height: 430px;

                padding:
                    40px 20px;
            }

            .mensaje {
                line-height: 1.7;
            }

            .corazon-boton {
                width: 80px;
                height: 80px;
            }

            .corazon-boton::before,
            .corazon-boton::after {
                width: 80px;
                height: 80px;
            }

            .corazon-boton::before {
                top: -40px;
            }

            .corazon-boton::after {
                left: 40px;
            }

            .texto-boton {
                font-size: 0.82rem;

                width: 145px;
            }
        }
    </style>
</head>

<body>

    <!-- Corazones del fondo -->
    <div id="corazones"></div>

    <main class="contenedor">

        <h1 class="titulo">
            Angelina
        </h1>

        <p class="subtitulo">
            💗 Una pequeña carta para ti 💗
        </p>

        <section
            class="carta cerrada"
            id="carta"
            onclick="abrirCarta()"
        >

            <!-- Parte del sobre -->
            <div class="sobre"></div>

            <!-- Decoraciones -->
            <span class="mini-corazon mini1">♥</span>
            <span class="mini-corazon mini2">♥</span>
            <span class="mini-corazon mini3">♥</span>
            <span class="mini-corazon mini4">♥</span>

            <!-- Corazón que se pulsa -->
            <div class="corazon-boton"></div>

            <div class="texto-boton">
                MACHUCA PARA ABRIR
            </div>

            <!-- Texto de la carta -->
            <div class="contenido">

                <h2>
                    Para Angelina 💗
                </h2>

                <p class="mensaje">
                    Mi mente es para pensarte,<br>
                    mi corazón para amarte.<br><br>

                    Si yo pudiera, te daría el mundo entero,<br>
                    pero lo único que te puedo dar<br>
                    es mi amor sincero.
                </p>

                <p class="firma">
                    Con cariño 💕
                </p>

            </div>

        </section>

    </main>

    <script>

        /* =========================================
           CREAR CORAZONES DEL FONDO
        ========================================= */

        const contenedorCorazones =
            document.getElementById("corazones");

        const colores = [
            "#ff4f9a",
            "#ff69b4",
            "#ff85bd",
            "#ff9dcc",
            "#ffb6d9"
        ];

        function crearCorazon() {

            const corazon =
                document.createElement("div");

            corazon.classList.add(
                "corazon-fondo"
            );

            const tamano =
                Math.random() * 25 + 15;

            const posicion =
                Math.random() * 100;

            const duracion =
                Math.random() * 8 + 7;

            const balanceo =
                Math.random() * 2 + 1;

            const color =
                colores[
                    Math.floor(
                        Math.random() *
                        colores.length
                    )
                ];

            corazon.style.width =
                tamano + "px";

            corazon.style.height =
                tamano + "px";

            corazon.style.left =
                posicion + "%";

            corazon.style.background =
                color;

            corazon.style.animationDuration =
                duracion + "s, " +
                balanceo + "s";

            corazon.style.opacity =
                Math.random() * 0.45 + 0.35;

            contenedorCorazones.appendChild(
                corazon
            );

            setTimeout(() => {

                corazon.remove();

            }, duracion * 1000);
        }

        /* Crear varios inicialmente */

        for (let i = 0; i < 35; i++) {
            crearCorazon();
        }

        /* Crear nuevos continuamente */

        setInterval(
            crearCorazon,
            500
        );


        /* =========================================
           ABRIR CARTA
        ========================================= */

        function abrirCarta() {

            const carta =
                document.getElementById(
                    "carta"
                );

            if (
                carta.classList.contains(
                    "abierta"
                )
            ) {
                return;
            }

            carta.classList.remove(
                "cerrada"
            );

            carta.classList.add(
                "abierta"
            );
        }

    </script>

</body>
</html>
